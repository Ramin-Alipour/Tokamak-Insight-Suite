name: GOLEM 30622 Rogowski reconstruction
on:
  push:
    branches: [main]
    paths:
      - "validation/golem_30622_rogowski.py"
      - ".github/workflows/golem-30622-rogowski.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Fetch GOLEM public signals and reconstruct plasma current
        id: reconstruction
        continue-on-error: true
        run: python validation/golem_30622_rogowski.py | tee golem_30622_rogowski.log
      - name: Upload numerical report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golem-30622-rogowski-validation
          path: |
            golem_30622_rogowski_result.json
            golem_30622_rogowski.log
          if-no-files-found: warn
      - name: Require a genuine raw-signal reconstruction
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("golem_30622_rogowski_result.json")
          if not p.exists():
              raise SystemExit("No reconstruction result JSON was produced.")
          result = json.loads(p.read_text())
          status = result.get("status")
          allowed = {"computed_from_raw_signals", "COMPUTED_raw_DAS_reconstruction"}
          print("Scientific validation status:", status)
          if status not in allowed:
              raise SystemExit("Pending: raw-signal reconstruction was unavailable; archived processed-signal cross-check is not independent raw-data validation.")
          PY
