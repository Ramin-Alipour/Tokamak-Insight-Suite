name: Analysis 2 — Langmuir validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langmuir-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  langmuir-and-suite:
    name: Python ${{ matrix.python-version }} — tests and dashboard smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --locked --extra test
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Compile application and packages
        run: uv run python -m compileall -q app.py tis tokamak_analysis
      - name: Run complete automated test suite
        run: uv run python -m pytest -q --cov=tis --cov=tokamak_analysis --cov-report=term-missing
      - name: Run critical Ruff checks
        run: uv run ruff check --select E4,E7,E9,F app.py tis tokamak_analysis tests
      - name: Exercise dashboard and Langmuir workspace with Streamlit AppTest
        run: |
          uv run python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=90).run()
          assert not app.exception, f"Dashboard startup failed: {app.exception}"

          page = app.radio(key="workspace_page")
          page.set_value("Probe Analysis")
          app.run(timeout=90)
          assert not app.exception, f"Probe Analysis workspace failed: {app.exception}"
          assert any("Probe" in str(element.value) for element in app.title), (
              "Probe Analysis workspace did not render its expected title."
          )
          print("PASS: dashboard startup and Probe Analysis workspace render without exceptions")
          PY
