name: Analysis 2 — Langmuir validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langmuir-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  langmuir-and-suite:
    name: Python ${{ matrix.python-version }} — tests and dashboard smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --locked --extra test
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Compile application and packages
        run: uv run python -m compileall -q app.py tis tokamak_analysis
      - name: Run complete automated test suite
        run: uv run python -m pytest -q --cov=tis --cov=tokamak_analysis --cov-report=term-missing
      - name: Run critical Ruff checks for Analysis 2 and its dashboard tests
        run: >-
          uv run ruff check --select E4,E7,E9,F
          tokamak_analysis/langmuir_probe.py
          tests/test_analysis_2_langmuir.py
          tests/test_langmuir_completion.py
          tests/test_langmuir_probe_completion.py
          tests/test_langmuir_probe_workflow.py
          tests/test_app_smoke.py
      - name: Exercise dashboard and Langmuir analysis end-to-end with Streamlit AppTest
        run: |
          uv run python - <<'PY'
          import numpy as np
          import pandas as pd
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=90).run()
          assert not app.exception, f"Dashboard startup failed: {app.exception}"

          voltage = np.linspace(-10.0, 10.0, 81)
          current = -1.0e-3 + 2.0e-4 * np.exp((voltage + 10.0) / 3.0)
          app.session_state["tis_df"] = pd.DataFrame(
              {"voltage_V": voltage, "current_A": current}
          )
          app.session_state["tis_filename"] = "synthetic_langmuir_sweep.csv"
          app.session_state["tis_raw"] = b"synthetic Langmuir I-V test fixture"
          app.session_state["tis_sha"] = "synthetic-langmuir-fixture"
          app.radio(key="workspace_page").set_value("Probe Analysis")
          app.run(timeout=90)
          assert not app.exception, f"Probe Analysis workspace failed: {app.exception}"

          app.selectbox(key="probe_v").set_value("voltage_V")
          app.selectbox(key="probe_i").set_value("current_A")
          app.checkbox(key="probe_enable_electron_fit").check()
          app.run(timeout=90)
          next(button for button in app.button if button.label == "Analyze probe I–V").click()
          app.run(timeout=90)
          assert not app.exception, f"Interactive Langmuir analysis failed: {app.exception}"
          assert any(
              "Langmuir" in str(element.value) or "Probe" in str(element.value)
              for element in app.title
          ), "Probe Analysis workspace title was not rendered."
          assert any(
              "electron_temperature_eV" in str(element.value)
              for element in app.json
          ), "Interactive analysis did not render its numerical result."
          print("PASS: dashboard starts, Probe Analysis renders, and interactive Langmuir I-V analysis returns results")
          PY
