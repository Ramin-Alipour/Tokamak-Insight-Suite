name: External EAST probe scientific benchmark

on:
  push:
    paths:
      - 'tools/validate_east_probe.py'
      - '.github/workflows/east-probe-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  east-probe-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download published EAST probe series and reproduce window statistics
        run: python tools/validate_east_probe.py
      - name: Upload benchmark inputs and report
        uses: actions/upload-artifact@v4
        with:
          name: east-probe-external-benchmark
          path: artifacts/east-probe-validation/
          if-no-files-found: error
