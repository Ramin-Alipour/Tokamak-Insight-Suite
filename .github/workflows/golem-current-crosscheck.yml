name: GOLEM shot 30622 plasma-current cross-check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/golem-current-crosscheck.yml"

jobs:
  current-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Retrieve and independently calculate current metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          python - <<'PY'
          import json, urllib.request, hashlib, re, io
          from pathlib import Path
          import numpy as np

          base = "https://golem.fjfi.cvut.cz"
          shot_url = base + "/shots/30622/Data.php"
          req = urllib.request.Request(shot_url, headers={"User-Agent":"Tokamak-Insight-Suite-validation/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")

          def scalar(key):
              p = r'<a[^>]+id=["\']'+re.escape(key)+r'["\'][^>]*>[^<]*</a>\s*\(\s*<a[^>]+href=["\'][^"\']*/utils/data/30622/'+re.escape(key)+r'["\']>([^<]+)</a>'
              m = re.search(p, html, re.I)
              return float(m.group(1)) if m else None

          refs = {k:scalar(k) for k in ["rogowski_current_max","plasma_current_mean","plasma_start","plasma_end"]}
          out = {"shot":30622,"source_page":shot_url,"reference_scalars":refs,"signals":{},"comparisons":{}}
          specs = {
              "rogowski_current":"/operation/shots/30622/basicdiagn/Irogowski.npz",
              "plasma_current":"/operation/shots/30622/basicdiagn/Iplasma.npz"
          }
          arrays = {}
          for name,path in specs.items():
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"Tokamak-Insight-Suite-validation/1.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              Path("validation-output/"+name+".npz").write_bytes(raw)
              with np.load(io.BytesIO(raw),allow_pickle=True) as z:
                  data=np.asarray(z["data"],dtype=float).ravel()
                  t0=float(z["t_start"]); t1=float(z["t_end"])
                  time=np.linspace(t0,t1,len(data))
                  arrays[name]=(time,data)
                  out["signals"][name]={
                      "status":"DOWNLOADED_AND_ANALYZED","source_url":url,"bytes":len(raw),
                      "sha256":hashlib.sha256(raw).hexdigest(),"samples":int(data.size),
                      "time_start_s":t0,"time_end_s":t1,"sample_interval_s":float((t1-t0)/(len(data)-1)),
                      "signal_min_A":float(np.min(data)),"signal_max_A":float(np.max(data)),
                      "signal_max_abs_A":float(np.max(np.abs(data)))
                  }

          peak=float(np.max(arrays["rogowski_current"][1]))
          ref_peak=refs["rogowski_current_max"]
          if ref_peak is not None:
              out["comparisons"]["rogowski_peak"]={
                  "measured_positive_peak_A":peak,"GOLEM_reference_peak_A":ref_peak,
                  "absolute_difference_A":abs(peak-ref_peak),
                  "relative_difference_percent":abs(peak-ref_peak)/abs(ref_peak)*100 if ref_peak else None
              }

          t,I=arrays["plasma_current"]
          ref_mean=refs["plasma_current_mean"]
          candidates={}
          def add_window(name, mask, definition):
              if not mask.any():
                  candidates[name]={"status":"EMPTY_WINDOW","definition":definition}
                  return
              vals=I[mask]
              mean=float(np.mean(vals)); mean_abs=float(np.mean(np.abs(vals)))
              item={"status":"COMPUTED","definition":definition,
                    "window_start_s":float(t[mask][0]),"window_end_s":float(t[mask][-1]),
                    "samples":int(mask.sum()),"signed_mean_A":mean,
                    "absolute_mean_A":mean_abs,"positive_only_mean_A":float(np.mean(vals[vals>0])) if np.any(vals>0) else None,
                    "positive_fraction":float(np.mean(vals>0))}
              if ref_mean is not None:
                  item["reference_A"]=ref_mean
                  item["signed_relative_difference_percent"]=abs(mean-ref_mean)/abs(ref_mean)*100 if ref_mean else None
                  item["absolute_relative_difference_percent"]=abs(mean_abs-ref_mean)/abs(ref_mean)*100 if ref_mean else None
                  pos=vals[vals>0]
                  item["positive_only_relative_difference_percent"]=abs(float(np.mean(pos))-ref_mean)/abs(ref_mean)*100 if ref_mean and pos.size else None
              candidates[name]=item

          t_start=refs["plasma_start"]; t_end=refs["plasma_end"]
          if t_start is not None and t_end is not None:
              add_window("published_start_end", (t>=t_start)&(t<=t_end),
                         "GOLEM page plasma_start through plasma_end; reproduces current implementation")
          # Independent window definitions expose whether the reference is a
          # plateau/positive-current mean rather than a full signed discharge mean.
          add_window("full_trace", np.ones(I.shape,dtype=bool), "entire archived Iplasma trace")
          add_window("positive_current_only", I>0, "all samples with Iplasma > 0 A")
          peak_I=float(np.max(I))
          add_window("above_80pct_positive_peak", I>=0.8*peak_I,
                     "samples where Iplasma >= 80% of its positive maximum")
          add_window("above_90pct_positive_peak", I>=0.9*peak_I,
                     "samples where Iplasma >= 90% of its positive maximum")
          # Central 20–80% of the stated interval, avoiding ramp-up/down edges.
          if t_start is not None and t_end is not None and t_end>t_start:
              add_window("central_20_80pct_published_interval",
                         (t>=t_start+0.2*(t_end-t_start))&(t<=t_start+0.8*(t_end-t_start)),
                         "central 20–80% of GOLEM plasma_start/plasma_end interval")

          out["comparisons"]["plasma_current_mean_window_diagnostics"]={
              "GOLEM_reference_mean_A":ref_mean,
              "published_window_start_s":t_start,"published_window_end_s":t_end,
              "candidates":candidates,
              "interpretation":"Compare window definitions and signed/absolute/positive-only means. Do not select a matching window as validated unless GOLEM documents that exact averaging convention."
          }

          window_diagnostics = out["comparisons"].get("plasma_current_mean_window_diagnostics", {})
          published_window = window_diagnostics.get("candidates", {}).get("published_start_end", {})
          out["status"] = (
              "NUMERIC_CROSSCHECK_COMPLETE"
              if out["comparisons"].get("rogowski_peak") and published_window.get("status") == "COMPUTED"
              else "PARTIAL_NUMERIC_CROSSCHECK"
          )
          out["method_note"]="Raw GOLEM NPZ signals were downloaded and metrics independently calculated. Mean-current comparison uses the shot page's stated plasma_start/plasma_end interval; interpretation remains conditional on the archive's documented units and interval semantics."
          Path("validation-output/report.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Upload report and source signals
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: golem-current-crosscheck-30622
          path: validation-output/
