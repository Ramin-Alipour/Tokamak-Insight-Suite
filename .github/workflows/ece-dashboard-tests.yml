name: ECE dashboard and test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile application and ECE module
        run: python -m compileall -q app.py tokamak_analysis/ece_analysis.py tests
      - name: Run complete automated test suite
        run: python -m pytest -q
      - name: Verify dashboard exposes the ECE workflow
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("app.py").read_text(encoding="utf-8")
          ast.parse(source, filename="app.py")
          required = (
              "ECE channel/profile analysis",
              "Analyze ECE channels and reconstruct Te profile",
              "reconstruct_ece_temperature_profile(",
              "tis_ece_profile_analysis.json",
              "TIS performs no detector calibration",
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"ECE dashboard integration missing: {missing}")
          print("ECE dashboard integration and calibrated-input policy are present.")
          PY
