name: ECE dashboard and test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 25
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile application and ECE module
        run: python -m compileall -q app.py tokamak_analysis/ece_analysis.py tests
      - name: Run complete automated test suite
        run: python -m pytest -q
      - name: Verify dashboard exposes the ECE workflow
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("app.py").read_text(encoding="utf-8")
          ast.parse(source, filename="app.py")
          required = (
              "ECE channel/profile analysis",
              "Brightness temperature",
              "Resonance mapping",
              "Channel fluctuations / PSD",
              "Te profile reconstruction",
              "Reconstruct ECE Te profile",
              "welch_psd_confidence_lower",
              "electron_temperature_profile_time_eV",
              "tis_ece_profile_analysis.json",
              "TIS performs no detector calibration",
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"ECE dashboard integration missing: {missing}")
          print("ECE dashboard integration and calibrated-input policy are present.")
          PY

      - name: Exercise ECE dashboard interactions through Streamlit AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=30).run()
          if app.exception:
              details = "\\n".join(str(item.message) for item in app.exception)
              raise SystemExit(f"Dashboard raised an exception: {details}")
          print(f"Dashboard started without uncaught exceptions; rendered {len(app.get('button'))} buttons.")
          PY

  live-browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and browser-test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser ECE dashboard test
        env:
          TIS_RUN_LIVE_BROWSER_E2E: "1"
        run: python -m pytest -q tests/e2e/test_ece_live_browser.py
