name: TIS CI
run-name: TIS CI — ${{ github.event_name }} — ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run interactive Langmuir dashboard regression
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_langmuir_dashboard.py
      - name: Run interactive Thomson-scattering dashboard regressions
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_thomson_dashboard.py
      - name: Run interactive ECE dashboard regressions
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_ece_dashboard.py
      - name: Run ECE physics and dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_ece_analysis.py tests/test_ece_dashboard.py
      - name: Validate CXRS registry execution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("DIAGNOSTIC_REGISTRY.json").read_text(encoding="utf-8"))
          matches = [item for item in registry if item.get("diagnostic") == "Charge-exchange recombination spectroscopy (CXRS)"]
          assert len(matches) == 1, f"Expected exactly one CXRS registry entry, got {len(matches)}"
          item = matches[0]
          contract = item["execution_contract"]
          assert contract["completeness"] == "complete_with_declared_scope"
          assert "tokamak_analysis.cxrs.analyze_cxrs_line" in item["implementation_functions"]
          inputs = {field["name"] for field in contract["input_specs"]}
          outputs = {field["name"] for field in contract["output_specs"]}
          assert {"wavelength_nm", "signal", "rest_wavelength_nm", "ion_mass_amu", "instrument_sigma_nm", "instrument_sigma_uncertainty_nm", "rest_wavelength_uncertainty_nm"} <= inputs
          assert {"ion_temperature_eV", "ion_temperature_uncertainty_eV", "line_of_sight_velocity_m_s", "velocity_uncertainty_m_s", "fitted_signal", "residual"} <= outputs
          print("CXRS registry execution contract is consistent.")
          PY
      - name: Run CXRS physics and interactive dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_cxrs.py tests/test_cxrs_dashboard.py
      - name: Run Streamlit dashboard smoke test
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=120).run()
          if app.exception:
              raise AssertionError("\n".join(str(item.value) for item in app.exception))
          print("Streamlit dashboard startup smoke test passed.")
          PY
