name: TIS CI
# CXRS acceptance is included in the full matrix below.
run-name: TIS CI — ${{ github.event_name }} — ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run interactive Langmuir dashboard regression
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_langmuir_dashboard.py
      - name: Run interactive Thomson-scattering dashboard regressions
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_thomson_dashboard.py
      - name: Run interactive ECE dashboard regressions
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_ece_dashboard.py
      - name: Run ECE physics and dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_ece_analysis.py tests/test_ece_dashboard.py
      - name: Validate CXRS registry execution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path("DIAGNOSTIC_REGISTRY.json").read_text(encoding="utf-8"))
          matches = [item for item in registry if item.get("diagnostic") == "Charge-exchange recombination spectroscopy (CXRS)"]
          assert len(matches) == 1, f"Expected exactly one CXRS registry entry, got {len(matches)}"
          item = matches[0]
          contract = item["execution_contract"]
          assert contract["completeness"] == "complete_with_declared_scope"
          assert "tokamak_analysis.cxrs.analyze_cxrs_line" in item["implementation_functions"]
          inputs = {field["name"] for field in contract["input_specs"]}
          outputs = {field["name"] for field in contract["output_specs"]}
          assert {"wavelength_nm", "signal", "rest_wavelength_nm", "ion_mass_amu", "instrument_sigma_nm", "instrument_sigma_uncertainty_nm", "rest_wavelength_uncertainty_nm"} <= inputs
          assert {"ion_temperature_eV", "ion_temperature_uncertainty_eV", "line_of_sight_velocity_m_s", "velocity_uncertainty_m_s", "fitted_signal", "residual"} <= outputs
          print("CXRS registry execution contract is consistent.")
          PY
      - name: Run CXRS physics and interactive dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_cxrs.py tests/test_cxrs_dashboard.py
      - name: Run molecular spectroscopy physics and interactive dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_molecular_spectroscopy.py tests/test_molecular_spectroscopy_dashboard.py
      - name: Run Doppler ion-temperature physics and interactive dashboard acceptance suite
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q tests/test_doppler_temperature.py tests/test_doppler_ion_temperature_dashboard.py
      - name: Run live Streamlit HTTP smoke test
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/tis-streamlit.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8501"
          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/_stcore/health", timeout=3) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      assert response.status == 200, f"health endpoint status={response.status}"
                      assert "ok" in body.lower(), f"unexpected health response: {body!r}"
                  with urllib.request.urlopen(base, timeout=5) as response:
                      page = response.read().decode("utf-8", errors="replace")
                      assert response.status == 200, f"dashboard status={response.status}"
                      assert "streamlit" in page.lower(), "dashboard response is not Streamlit HTML"
                  print("Live Streamlit HTTP health and dashboard endpoints passed.")
                  break
              except (OSError, urllib.error.URLError, AssertionError) as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise RuntimeError(f"Live Streamlit HTTP smoke test failed: {last_error}")
          PY
          cat /tmp/tis-streamlit.log

      - name: Run Streamlit dashboard smoke test
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=120).run()
          if app.exception:
              raise AssertionError("\n".join(str(item.value) for item in app.exception))
          print("Streamlit dashboard startup smoke test passed.")
          PY
