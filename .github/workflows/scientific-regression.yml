name: scientific-regression-and-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"
      - name: Run scientific and software regression tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel outside source checkout and verify resources/CLI
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl | head -n 1)"
          python -m venv /tmp/tis-wheel-env
          /tmp/tis-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/tis-wheel-env/bin/python -m pip install "$WHEEL"
          cd /tmp
          /tmp/tis-wheel-env/bin/python -c "import app, tis; from tis.catalog import DIAGNOSTICS, FORMULAS; assert DIAGNOSTICS and FORMULAS; print('installed', tis.__version__, 'diagnostics', len(DIAGNOSTICS), 'formulas', len(FORMULAS))"
          /tmp/tis-wheel-env/bin/tis catalog --kind both --output-dir /tmp/tis-catalog
          test -s /tmp/tis-catalog/DIAGNOSTIC_REGISTRY.json
          test -s /tmp/tis-catalog/FORMULA_REGISTRY.json
      - name: Launch installed dashboard and check HTTP health
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/tis-wheel-env/bin/tis-dashboard --server.headless true --server.port 8765 --browser.gatherUsageStats false > /tmp/tis-streamlit.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health >/dev/null; then
              echo "Installed Streamlit dashboard health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          exit 1
