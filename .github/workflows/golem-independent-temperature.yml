name: GOLEM independent temperature cross-check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golem-temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Retrieve explicitly linked GOLEM temperature data products
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          import numpy as np

          shot = 30622
          root = f"https://golem.fjfi.cvut.cz"
          out = pathlib.Path("golem-temperature-validation")
          out.mkdir(exist_ok=True)
          # These identifiers and legacy paths are copied from the actual hrefs
          # in GOLEM's shot 30622 Data.php, not guessed diagnostic folder names.
          candidates = {
              "electron_temperature": [
                  # Canonical identifier documented by GOLEM's Data.php and
                  # data-processing documentation (filename is ElectronTemp).
                  f"{root}/operation/shots/{shot}/basicdiagn/ElectronTemperature",
                  f"http://golem.fjfi.cvut.cz/operation/shots/{shot}/basicdiagn/ElectronTemperature",
                  f"{root}/cgi-bin/data/{shot}/electron_temperature",
                  f"{root}/cgi-bin/data/{shot}/electron_temperature.txt",
                  f"{root}/cgi-bin/data/{shot}/ElectronTemp",
                  # Official Data.php identifies ElectronTemp as the published
                  # Pygolem identifier; query the documented /utils/data endpoint.
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/ElectronTemp",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/ElectronTemp.txt",
                  f"{root}/utils/data/{shot}/electron_temperature.txt",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/electron_temperature",
                  f"{root}/operation/shots/{shot}/basicdiagn/ElectronTemp",
                  f"{root}/operation/shots/{shot}/basicdiagn/ElectronTemp.txt",
                  # GOLEM Data.php lists ElectronTemp under shots/<shot>/basicdiagn.
                  # Try its published path as legacy cgi-bin aliases may be absent.
                  f"{root}/shots/{shot}/basicdiagn/ElectronTemp",
                  f"{root}/shots/{shot}/basicdiagn/ElectronTemp.txt",
                  f"{root}/operation/shots/{shot}/temperature",
                  f"{root}/operation/shots/{shot}/temperature_mean",
              ],
              "rake_probe_electron_temperature": [
                  f"{root}/cgi-bin/data/{shot}/electron_temp_probe",
                  f"{root}/cgi-bin/data/{shot}/electron_temp_probe.txt",
                  f"{root}/utils/data/{shot}/electron_temp_probe",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/Te_probe",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/Te_probe.txt",
                  f"{root}/operation/shots/{shot}/diagnostics/ParticleFlux/1012RakeProbe.ON/Te_probe",
              ],
              "spectrometer_mean_estimated_temperature": [
                  f"{root}/cgi-bin/data/{shot}/spectrometr:mean_temperature",
                  f"{root}/cgi-bin/data/{shot}/spectrometr/mean_temperature",
                  f"{root}/operation/shots/{shot}/analysis/Radiation/1212Impurities_TO.ON/HistoricalAnalysis/temperature",
                  f"{root}/operation/shots/{shot}/temperature",
              ],
              "published_electron_temperature_mean": [
                  f"{root}/cgi-bin/data/{shot}/temperature_mean",
                  f"{root}/cgi-bin/data/{shot}/ElectronTemperatureMean",
                  # This identifier is explicitly listed for the published mean.
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/ElectronTemperatureMean",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/ElectronTemperatureMean.txt",
                  f"{root}/operation/shots/{shot}/basicdiagn/ElectronTemperatureMean",
                  f"{root}/operation/shots/{shot}/temperature_mean",
              ],
          }
          report = {
              "test": "GOLEM shot 30622 temperature products cross-check",
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
              "shot": shot,
              "published_electron_temperature_mean_eV": 20.8,
              "reference_page": f"{root}/shots/{shot}/Data.php",
              "provenance": "Data-product links matched against the actual HTML hrefs in GOLEM Data.php.",
              "interpretation_limits": [
                  "The 20.8 eV published scalar is electron temperature, not ion temperature.",
                  "Rake-probe temperature is a separate diagnostic product; compare only after units, time window, and column meaning are confirmed.",
                  "The spectrometer's 'mean estimated temperature' must not be assumed to equal H-alpha Doppler Ti without its method definition.",
                  "No ion-temperature result is accepted from an under-resolved H-alpha line."
              ]
          }

          def read_numeric(raw, suffix):
              if suffix.lower() == ".xls" or raw[:4] == b"PK\x03\x04":
                  return None, "binary spreadsheet/NPZ requires format-specific parser"
              rows = []
              for line in raw.decode("utf-8", errors="replace").splitlines():
                  line = line.strip()
                  if not line or line.startswith(("#", "%", "//")):
                      continue
                  try:
                      vals = [float(token) for token in line.replace(",", " ").split()]
                  except ValueError:
                      continue
                  if vals and all(np.isfinite(vals)):
                      rows.append(vals)
              if not rows:
                  return None, "no numeric rows"
              from collections import Counter
              width = Counter(map(len, rows)).most_common(1)[0][0]
              rows = [row for row in rows if len(row) == width]
              return np.asarray(rows, dtype=float), None

          for kind, urls in candidates.items():
              attempts, result = [], None
              for url in urls:
                  try:
                      req = Request(url, headers={"User-Agent": "Tokamak-Insight-Suite-validation/1.3"})
                      with urlopen(req, timeout=12) as response:
                          raw = response.read()
                          ctype = response.headers.get("Content-Type", "")
                          final_url = response.geturl()
                      if not raw or b"<html" in raw[:1000].lower() or b"<!doctype" in raw[:1000].lower():
                          raise ValueError("empty response or HTML, not data")
                      arr, parse_error = read_numeric(raw, pathlib.Path(url.split("?", 1)[0]).suffix)
                      if arr is None:
                          attempts.append({"url": url, "status": "downloaded_unparsed", "bytes": len(raw),
                                           "content_type": ctype, "reason": parse_error})
                          continue
                      attempts.append({"url": url, "final_url": final_url, "status": "numeric_data",
                                       "bytes": len(raw), "content_type": ctype,
                                       "rows": int(arr.shape[0]), "columns": int(arr.shape[1])})
                      result = (url, final_url, raw, arr)
                      break
                  except Exception as exc:
                      attempts.append({"url": url, "status": "failed", "error": f"{type(exc).__name__}: {exc}"})
              report.setdefault("retrieval_attempts", {})[kind] = attempts
              if result:
                  url, final_url, raw, arr = result
                  filename = f"{kind}.txt"
                  (out / filename).write_bytes(raw)
                  report[kind] = {
                      "source_url": url, "final_url": final_url, "filename": filename,
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "n_rows": int(arr.shape[0]), "n_columns": int(arr.shape[1]),
                      "column_statistics": [
                          {
                              "column_index_zero_based": i,
                              "n": int(arr[:, i].size),
                              "mean": float(np.mean(arr[:, i])),
                              "median": float(np.median(arr[:, i])),
                              "std_sample": float(np.std(arr[:, i], ddof=1)) if arr.shape[0] > 1 else 0.0,
                              "min": float(np.min(arr[:, i])),
                              "max": float(np.max(arr[:, i]))
                          } for i in range(arr.shape[1])
                      ]
                  }
              else:
                  report[kind] = {"status": "not_retrieved_as_numeric_data"}

          # Compare the one-column electron-temperature series with the published
          # mean only when the input's shape supports that interpretation.
          series = report.get("electron_temperature", {})
          if series.get("n_columns") == 1:
              mean = series["column_statistics"][0]["mean"]
              ref = report["published_electron_temperature_mean_eV"]
              report["comparison"] = {
                  "computed_series_mean_eV": mean,
                  "published_mean_eV": ref,
                  "difference_eV": mean - ref,
                  "absolute_difference_eV": abs(mean - ref),
                  "relative_difference_percent": 100 * abs(mean - ref) / abs(ref),
                  "status": "numerical_consistency_only",
                  "caution": "The time window and averaging convention must match before claiming exact reproduction."
              }
              report["status"] = "cross-check-computed"
          elif series.get("n_columns", 0) > 1:
              report["status"] = "data-retrieved-column-semantics-unresolved"
          else:
              report["status"] = "retrieval-or-format-unresolved"
          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2), flush=True)
          PY
      - name: Enforce honest validation status
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("golem-temperature-validation/report.json").read_text())
          status = report.get("status")
          print(f"Scientific cross-check status: {status}")
          if status == "cross-check-computed":
              print("An electron-temperature series comparison was computed; inspect the artifact before interpreting it.")
          elif status in {"retrieval-or-format-unresolved", "data-retrieved-column-semantics-unresolved"}:
              print("::warning::No interpretable GOLEM temperature comparison was completed. This is an upstream data/format limitation, not a scientific validation pass; inspect the artifact and keep the result unvalidated.")
          else:
              print(f"::error::Unexpected GOLEM validation status: {status}")
              sys.exit(1)
          PY
      - name: Upload reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: golem-shot-30622-temperature-cross-check
          path: golem-temperature-validation/
          if-no-files-found: warn
          retention-days: 30
