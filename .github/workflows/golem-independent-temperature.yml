name: GOLEM independent temperature cross-check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golem-temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Retrieve GOLEM temperature series through documented data identifiers
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          import numpy as np

          shot = 30622
          out = pathlib.Path("golem-temperature-validation")
          out.mkdir(exist_ok=True)
          # Identifiers and legacy storage paths are taken from the GOLEM shot-page
          # inventory and the repository's working spectrum-acquisition strategy.
          candidates = {
              "electron_temperature": [
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/spectrometr:temperature",
                  f"https://golem.fjfi.cvut.cz/utils/data/{shot}/spectrometr:temperature",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/temperature",
                  f"http://golem.fjfi.cvut.cz/golem/database/operation/shots/{shot}/analysis/Radiation/1212Impurities_TO.ON/data/temperature",
                  f"https://golem.fjfi.cvut.cz/operation/shots/{shot}/diagnostics/Radiation/1111Spectrometer.ON/data/temperature",
              ],
              "spectrometer_mean_temperature": [
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/spectrometr:mean_temperature",
                  f"https://golem.fjfi.cvut.cz/utils/data/{shot}/spectrometr:mean_temperature",
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/temperature_mean",
                  f"http://golem.fjfi.cvut.cz/golem/database/operation/shots/{shot}/analysis/Radiation/1212Impurities_TO.ON/data/temperature",
              ],
              "published_electron_temperature_mean": [
                  f"http://golem.fjfi.cvut.cz/utils/data/{shot}/temperature_mean",
                  f"http://golem.fjfi.cvut.cz/golem/database/operation/shots/{shot}/basicdiagn/ElectronTemperatureMean",
                  f"https://golem.fjfi.cvut.cz/operation/shots/{shot}/temperature_mean",
              ],
          }
          report = {
              "test": "GOLEM shot 30622 archive temperature retrieval and numerical consistency audit",
              "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
              "shot": shot,
              "published_reference_mean_eV": 20.8,
              "reference_page": f"https://golem.fjfi.cvut.cz/shots/{shot}/Data.php",
              "metadata": {
                  "temperature_mean": "ElectronTemperatureMean; electron temperature [eV]",
                  "spectrometr:temperature": "T_e [eV] per GOLEM shot-page metadata",
                  "spectrometr:mean_temperature": "Mean estimated temperature [eV]; not automatically equivalent to Doppler Ti"
              },
              "scientific_caution": "This cross-check is for archive electron-temperature products only. It does not validate ion temperature from H-alpha Doppler broadening."
          }

          def parse_numeric(raw):
              decoded = raw.decode("utf-8", errors="replace")
              rows = []
              for line in decoded.splitlines():
                  line = line.strip()
                  if not line or line.startswith(("#", "%", "//")):
                      continue
                  vals = []
                  for token in line.replace(",", " ").split():
                      try:
                          val = float(token)
                      except ValueError:
                          vals = []
                          break
                      if not np.isfinite(val):
                          vals = []
                          break
                      vals.append(val)
                  if vals:
                      rows.append(vals)
              if not rows:
                  return None
              lengths = {len(row) for row in rows}
              if len(lengths) != 1:
                  # GOLEM text exports can contain metadata blocks; retain only
                  # the most frequent numeric row width, never concatenate columns.
                  from collections import Counter
                  width = Counter(map(len, rows)).most_common(1)[0][0]
                  rows = [row for row in rows if len(row) == width]
              arr = np.asarray(rows, dtype=float)
              return arr if arr.shape[0] >= 1 else None

          for kind, urls in candidates.items():
              result, attempts = None, []
              for url in urls:
                  try:
                      req = Request(url, headers={"User-Agent": "Tokamak-Insight-Suite-validation/1.2"})
                      with urlopen(req, timeout=15) as response:
                          raw = response.read()
                          content_type = response.headers.get("Content-Type", "")
                          final_url = response.geturl()
                      if not raw or b"<html" in raw[:1000].lower() or b"<!doctype" in raw[:1000].lower():
                          raise ValueError("empty response or HTML, not numeric data")
                      arr = parse_numeric(raw)
                      if arr is None:
                          raise ValueError("no numeric rows found")
                      attempts.append({"url": url, "final_url": final_url, "status": "numeric_data",
                                       "bytes": len(raw), "content_type": content_type,
                                       "rows": int(arr.shape[0]), "columns": int(arr.shape[1])})
                      result = (url, final_url, raw, arr)
                      break
                  except Exception as exc:
                      attempts.append({"url": url, "status": "failed", "error": f"{type(exc).__name__}: {exc}"})
              report.setdefault("retrieval_attempts", {})[kind] = attempts
              if result:
                  url, final_url, raw, arr = result
                  filename = f"{kind}.txt"
                  (out / filename).write_bytes(raw)
                  # GOLEM temperature exports are expected to be a scalar series.
                  # For multi-column exports, summarize each column separately and
                  # do not silently assume the last column is the physical quantity.
                  column_stats = []
                  for col in range(arr.shape[1]):
                      values = arr[:, col]
                      column_stats.append({
                          "column_index_zero_based": col,
                          "n": int(values.size),
                          "mean": float(np.mean(values)),
                          "median": float(np.median(values)),
                          "std_sample": float(np.std(values, ddof=1)) if values.size > 1 else 0.0,
                          "min": float(np.min(values)),
                          "max": float(np.max(values))
                      })
                  report[kind] = {
                      "source_url": url, "final_url": final_url, "filename": filename,
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "n_rows": int(arr.shape[0]), "n_columns": int(arr.shape[1]),
                      "column_statistics": column_stats,
                      "unit_confirmed_from_shot_page": True
                  }
              else:
                  report[kind] = {"status": "not_retrieved_as_numeric_data"}

          # Compare only a downloaded one-column electron-temperature product with
          # the scalar published electron-temperature mean. Avoid mixing time and
          # temperature columns or the separate spectrometer mean-estimated product.
          series = report.get("electron_temperature", {})
          if series.get("n_columns") == 1:
              values = series["column_statistics"][0]
              mean = values["mean"]
              delta = mean - report["published_reference_mean_eV"]
              report["comparison"] = {
                  "compared_quantity": "mean of downloaded one-column electron-temperature series",
                  "computed_mean_eV": mean,
                  "published_mean_eV": report["published_reference_mean_eV"],
                  "difference_eV": delta,
                  "absolute_difference_eV": abs(delta),
                  "relative_difference_percent": 100 * abs(delta) / abs(report["published_reference_mean_eV"]),
                  "status": "numerical_consistency_only",
                  "caution": "Confirm time window and exact averaging convention before treating this as reproduction of the published scalar."
              }
              report["status"] = "cross-check-computed"
          elif series.get("n_columns", 0) > 1:
              report["status"] = "data-retrieved-column-semantics-unresolved"
          else:
              report["status"] = "retrieval-or-format-unresolved"
          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2), flush=True)
          PY
      - name: Enforce honest validation status
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("golem-temperature-validation/report.json").read_text())
          status = report.get("status")
          print(f"Scientific cross-check status: {status}")
          if status != "cross-check-computed":
              print("No one-column electron-temperature series comparison was completed.")
              sys.exit(1)
          PY
      - name: Upload reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golem-shot-30622-temperature-cross-check
          path: golem-temperature-validation/
          if-no-files-found: warn
          retention-days: 30
