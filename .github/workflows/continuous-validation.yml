name: Continuous validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' pytest-cov ruff
      - name: Compile Python sources
        run: python -m compileall -q app.py tis tokamak_analysis tests
      - name: Run static checks for syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 app.py tis tokamak_analysis tests
      - name: Run automated tests with coverage
        run: python -m pytest -q --cov=tis --cov=tokamak_analysis --cov-report=term-missing
      - name: Smoke-test CLI and exported registries after clean install
        shell: bash
        run: |
          set -euo pipefail
          tis --help
          output_dir="$RUNNER_TEMP/tis-registry-smoke"
          tis catalog --kind both --output-dir "$output_dir"
          python - "$output_dir" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          diagnostics = json.loads((root / "DIAGNOSTIC_REGISTRY.json").read_text())
          formulas = json.loads((root / "FORMULA_REGISTRY.json").read_text())
          assert len(diagnostics) == 80, f"Expected 80 diagnostic entries, got {len(diagnostics)}"
          assert len(formulas) == 37, f"Expected 37 formula entries, got {len(formulas)}"
          assert all(item.get("execution_contract") for item in formulas), "Formula contract missing"
          PY
      - name: Exercise every workspace page with Streamlit AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          pages = [
              "Home",
              "Public Data Access",
              "Data Import & QC",
              "Time Series & MHD",
              "Events & Transients",
              "Spectral Analysis",
              "Probe Analysis",
              "Plasma Parameters",
              "Confinement & Scalings",
              "Equilibrium & Reconstruction",
              "Tomography & Bolometry",
              "Advanced Analysis",
              "Diagnostic Catalog",
              "Project Manager",
              "Reports & Export",
          ]
          app = AppTest.from_file("app.py", default_timeout=45)
          app.run()
          assert not app.exception, f"Home page raised: {app.exception}"
          assert len(app.radio) > 0, "Workspace page selector was not rendered."
          observed = list(app.radio[0].options)
          assert observed == pages, f"Workspace page list changed unexpectedly: {observed}"
          for page in pages[1:]:
              app.radio[0].set_value(page).run()
              assert not app.exception, f"{page} raised: {app.exception}"
          PY
      - name: Start Streamlit dashboard and check HTTP health
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/tis-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "PASS: Streamlit health endpoint responded."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tis-streamlit.log
          echo "FAIL: Streamlit health endpoint did not respond."
          exit 1
