name: Continuous validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' pytest-cov ruff
      - name: Compile Python sources
        run: python -m compileall -q app.py tis tokamak_analysis tests
      - name: Run static checks for syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 app.py tis tokamak_analysis tests
      - name: Run automated tests with coverage
        run: python -m pytest -q --cov=tis --cov=tokamak_analysis --cov-report=term-missing
      - name: Exercise Home and Probe pages with Streamlit AppTest
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=30)
          app.run()
          assert not app.exception, f"Home page raised: {app.exception}"

          # The first radio is the sidebar WORKSPACE page selector.
          assert len(app.radio) > 0, "Workspace page selector was not rendered."
          app.radio[0].set_value("Probe Analysis").run()
          assert not app.exception, f"Probe Analysis page raised: {app.exception}"
          assert any("Langmuir, Ball-Pen & Probe Analysis" in item.value for item in app.title), (
              "Probe Analysis page did not render its expected title."
          )
          PY
      - name: Start Streamlit dashboard and check HTTP health
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/tis-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "PASS: Streamlit health endpoint responded."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tis-streamlit.log
          echo "FAIL: Streamlit health endpoint did not respond."
          exit 1
