name: LHD CXS7 validation
on:
  push:
    paths:
      - "tools/validate_lhd_164208_cxs.py"
      - ".github/workflows/lhd-164208-cxs-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas scipy
      - run: python tools/validate_lhd_164208_cxs.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lhd-164208-cxs-validation
          path: artifacts/lhd-164208-cxs-validation/
