name: Extract source package and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tis-source-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract source files
        run: |
          unzip -q Tokamak_Insight_Suite_v0.3.0.zip -d /tmp/tis-package
          cp -a /tmp/tis-package/Tokamak_Insight_Suite/. .
          rm -rf /tmp/tis-package
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py tis tests
      - name: Run test suite
        run: pytest -q
      - name: Launch dashboard smoke test
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/tis-streamlit.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit dashboard health check passed."
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          kill "$pid" || true
          exit 1
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add source, dashboard, diagnostic catalog, formulas, and tests"
            git pull --rebase origin main
            git push
          fi
