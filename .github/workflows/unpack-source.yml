name: Test and package Tokamak Insight Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tis-source-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py tis tests

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Launch dashboard smoke test
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/tis-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit dashboard health check passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          exit 1

      - name: Build source ZIP from tested repository
        run: |
          rm -rf /tmp/tis-package
          mkdir -p /tmp/tis-package/Tokamak_Insight_Suite
          git archive HEAD | tar -x -C /tmp/tis-package/Tokamak_Insight_Suite
          rm -f /tmp/tis-package/Tokamak_Insight_Suite/Tokamak_Insight_Suite_v0.3.0.zip
          cd /tmp/tis-package
          zip -qr "$GITHUB_WORKSPACE/Tokamak_Insight_Suite_v0.3.0.zip" Tokamak_Insight_Suite

      - name: Commit refreshed source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tokamak_Insight_Suite_v0.3.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source package from tested repository"
            git push
          fi
