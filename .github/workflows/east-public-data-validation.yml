name: EAST shot 22010 empirical flux comparison

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/validate_east_22010_flux.py"
      - ".github/workflows/east-public-data-validation.yml"

permissions:
  contents: read

jobs:
  east-22010:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Reconstruct published EAST flux statistics
        run: python tools/validate_east_22010_flux.py --output-dir artifacts/east-22010-validation
      - name: Upload raw inputs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: east-22010-flux-validation
          path: artifacts/east-22010-validation/
          if-no-files-found: warn
          retention-days: 30
