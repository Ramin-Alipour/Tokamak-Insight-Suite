name: Spectroscopy benchmark arithmetic checks

on:
  push:
    paths:
      - ".github/workflows/spectroscopy-benchmark-tests.yml"
      - "benchmarks/**"
      - "tests/test_aditya_u_ti_reproduction.py"
      - "tests/test_start_published_width_check.py"
  workflow_dispatch:

jobs:
  benchmark-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run spectroscopy benchmark checks
        run: python -m pytest -q tests/test_aditya_u_ti_reproduction.py tests/test_start_published_width_check.py
