name: Test and package Tokamak Insight Suite

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tis-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q app.py tis tokamak_analysis tests

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify installed wheel contains canonical registries
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/tis-wheel .
          python -m pip install --no-deps --target /tmp/tis-installed /tmp/tis-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/tis-installed python - <<'PY'
          from tis.catalog import DIAGNOSTICS, FORMULAS
          from tis.contracts import get_diagnostic_contracts

          assert len(DIAGNOSTICS) == 80
          assert len(FORMULAS) == 37
          assert len(get_diagnostic_contracts()) == 80

          # Exercise the installed console-entry-point implementation, not the
          # checkout's source tree, and verify its generated registry artifact.
          import json
          import sys
          import tempfile
          from pathlib import Path
          from tis import __version__
          from tis.cli import main

          assert __version__ == "0.5.1"
          with tempfile.TemporaryDirectory() as tmp:
              sys.argv = ["tis", "catalog", "--kind", "analyses", "--output-dir", tmp]
              assert main() == 0
              output = Path(tmp) / "ANALYSIS_REGISTRY.json"
              rows = json.loads(output.read_text(encoding="utf-8"))
              assert len(rows) == 81
              assert [row["id"] for row in rows] == list(range(1, 82))
          print("Installed wheel registries, contracts, version, and CLI smoke test passed.")
          PY

      - name: Launch dashboard smoke test
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/tis-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit dashboard health check passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          exit 1

      - name: Build source ZIP from tested repository
        run: |
          rm -rf /tmp/tis-package
          mkdir -p /tmp/tis-package/Tokamak_Insight_Suite
          git archive HEAD | tar -x -C /tmp/tis-package/Tokamak_Insight_Suite
          cd /tmp/tis-package
          zip -qr "$GITHUB_WORKSPACE/Tokamak_Insight_Suite_${{ github.ref_name }}.zip" Tokamak_Insight_Suite

      - name: Generate SHA-256 checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum Tokamak_Insight_Suite_${{ github.ref_name }}.zip > Tokamak_Insight_Suite_${{ github.ref_name }}.zip.sha256

      - name: Upload tested source ZIP and checksum
        uses: actions/upload-artifact@v6
        with:
          name: tokamak-insight-suite-source
          path: |
            Tokamak_Insight_Suite_${{ github.ref_name }}.zip
            Tokamak_Insight_Suite_${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
