name: Publish tested release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tis-release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    # Manual dispatch is supported only when the selected ref is a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Verify tag, project, and runtime versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from tis import __version__

          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"]
          expected_tag = f"v{project_version}"
          if tag_version != expected_tag or __version__ != project_version:
              raise SystemExit(
                  f"Release version mismatch: tag={tag_version}, "
                  f"pyproject={project_version}, tis.__version__={__version__}"
              )
          print(f"Release version verified: {tag_version}")
          PY

      - name: Compile source
        run: python -m compileall -q app.py tis tokamak_analysis tests

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Smoke-test Streamlit dashboard
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/tis-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit dashboard health check passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          exit 1

      - name: Package the tested tag source and checksum
        run: |
          set -euo pipefail
          rm -rf /tmp/tis-package
          mkdir -p /tmp/tis-package/Tokamak_Insight_Suite
          git archive HEAD | tar -x -C /tmp/tis-package/Tokamak_Insight_Suite
          cd /tmp/tis-package
          zip -qr "$GITHUB_WORKSPACE/Tokamak-Insight-Suite-${GITHUB_REF_NAME}.zip" Tokamak_Insight_Suite
          cd "$GITHUB_WORKSPACE"
          sha256sum "Tokamak-Insight-Suite-${GITHUB_REF_NAME}.zip" > "Tokamak-Insight-Suite-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish assets to this exact version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_file="Tokamak-Insight-Suite-${GITHUB_REF_NAME}.zip"
          checksum_file="${zip_file}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip_file" "$checksum_file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip_file" "$checksum_file" --generate-notes
          fi
