name: Apply v0.5.0 release package to main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v050-release.yml"

permissions:
  contents: write

concurrency:
  group: apply-v050-release
  cancel-in-progress: false

jobs:
  replace-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify user-provided v0.5.0 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Ramin-Alipour/Tokamak-Insight-Suite/releases/download/v0.5.0/Tokamak-Insight-Suite-v0.5.0.zip" \
            --output /tmp/Tokamak-Insight-Suite-v0.5.0.zip
          echo "3ce6c460344ba8104befeabe6bbbc3eeb760470b709ed5661bc38f1bca643a82  /tmp/Tokamak-Insight-Suite-v0.5.0.zip" | sha256sum --check
          mkdir -p /tmp/tis-release
          unzip -q /tmp/Tokamak-Insight-Suite-v0.5.0.zip -d /tmp/tis-release
          test -d /tmp/tis-release/Tokamak-Insight-Suite-main
          test -f /tmp/tis-release/Tokamak-Insight-Suite-main/app.py
          test -f /tmp/tis-release/Tokamak-Insight-Suite-main/pyproject.toml

      - name: Replace source files while preserving workflow files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' --exclude='.github/workflows/***' \
            /tmp/tis-release/Tokamak-Insight-Suite-main/ "$GITHUB_WORKSPACE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release source files already match main; no replacement commit needed."
          else
            git commit -m "Replace main source with v0.5.0 release package"
            git push origin HEAD:main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'

      - name: Compile Python source and tests
        run: python -m compileall -q app.py tis tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke-test Streamlit dashboard
        shell: bash
        run: |
          set -euo pipefail
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/tis-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit dashboard health check passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tis-streamlit.log
          exit 1
