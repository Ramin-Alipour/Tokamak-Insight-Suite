name: Real MAST data integration test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 8 * *"

concurrency:
  group: real-mast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install TIS and public-data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[data]'
      - name: Inventory published BPP and Thomson reference shot
        run: python tools/inventory_mast_bpp_reference.py
      - name: Fetch public raw MAST shot and run real-data checks
        run: |
          python tools/fetch_fair_mast_sample.py --output-dir artifacts/mast-real-data
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from tis.core import fft_spectrum, welch_psd, butterworth_filter

          base = Path("artifacts/mast-real-data")
          manifest = json.loads((base / "mast_29790_mirnov_manifest.json").read_text())
          frame = pd.read_csv(base / manifest["csv_file"])
          assert manifest["shot"] == 29790
          assert manifest["source_signal_class"] == "Raw"
          assert len(frame) >= 1024
          assert np.all(np.isfinite(frame["time_s"]))
          assert np.all(np.isfinite(frame["signal_raw"]))
          assert np.all(np.diff(frame["time_s"].to_numpy()) > 0)
          fs = manifest["estimated_sampling_rate_hz_after_stride"]
          f, a = fft_spectrum(frame["signal_raw"].to_numpy(), fs)
          fp, p = welch_psd(frame["signal_raw"].to_numpy(), fs)
          filtered = butterworth_filter(frame["signal_raw"].to_numpy(), fs, highpass=1000, lowpass=min(100000, fs*0.4))
          assert len(f) > 10 and len(fp) > 10 and len(filtered) == len(frame)
          assert np.all(np.isfinite(a)) and np.all(np.isfinite(p)) and np.all(np.isfinite(filtered))
          print(f"PASS: real MAST shot 29790; signal={manifest['signal']}; samples={len(frame)}; fs={fs:.3f} Hz")
          print("PASS: CSV ingestion, FFT, Welch PSD, and digital filtering on public raw data")
          PY
      - name: Fetch current and interferometer diagnostics from a second MAST shot
        run: python tools/fetch_fair_mast_multidiag.py --output-dir artifacts/mast-multidiag
      - name: Export an existing EFIT equilibrium snapshot
        run: python tools/fetch_fair_mast_efit.py --output-dir artifacts/mast-efit --time-s 0.2
      - name: Upload real-data test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mast-real-data-multidiagnostic-validation
          path: artifacts/
          if-no-files-found: error
