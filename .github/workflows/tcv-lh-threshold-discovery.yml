name: TCV L-H threshold data discovery
on:
  push:
    paths:
      - "tools/discover_tcv_lh_threshold_data.py"
      - ".github/workflows/tcv-lh-threshold-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install h5py
      - run: python tools/discover_tcv_lh_threshold_data.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tcv-lh-threshold-source
          path: artifacts/tcv-lh-transition-source/
