name: GOLEM ion-temperature identifiability audit

on:
  push:
    branches: [main]
    paths:
      - "tools/analyze_golem_ti_identifiability.py"
      - ".github/workflows/golem-ti-identifiability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golem-ti-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Analyze all Balmer lines and instrument-width sensitivity
        run: python tools/analyze_golem_ti_identifiability.py
      - name: Upload raw spectrum and reproducible analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golem-30622-ti-identifiability
          path: artifacts/golem-ti-identifiability/
          if-no-files-found: warn
          retention-days: 30
