name: GOLEM ion-temperature identifiability audit

on:
  push:
    branches: [main]
    paths:
      - "tools/analyze_golem_ti_identifiability.py"
      - "tools/discover_golem_bpp_31992.py"
      - "tools/acquire_golem_bpp_35362.py"
      - "tools/discover_golem_probe_30622.py"
      - "tools/validate_bpp_ti_published_figure.py"
      - "tis/probes.py"
      - "validation/golem_bpp_31992_figure3_digitized.csv"
      - "tests/test_swept_bpp_ion_temperature.py"
      - ".github/workflows/golem-ti-identifiability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golem-ti-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pytest
      - name: Test swept BPP Ti fitter
        run: python -m pytest -q tests/test_swept_bpp_ion_temperature.py
      - name: Compare BPP fit with published GOLEM shot 31992 figure
        run: python tools/validate_bpp_ti_published_figure.py
      - name: Analyze all Balmer lines and instrument-width sensitivity
        run: python tools/analyze_golem_ti_identifiability.py
      - name: Check shot 30622 for direct swept BPP voltage/current
        run: python tools/discover_golem_probe_30622.py
      - name: Acquire actual swept BPP signals from GOLEM shot 35362
        run: python tools/acquire_golem_bpp_35362.py
      - name: Discover raw swept BPP voltage/current signals for published Ti benchmark
        run: python tools/discover_golem_bpp_31992.py
      - name: Upload reproducible analyses and BPP signal discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golem-ti-and-bpp-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
