name: Tokamak Insight Suite CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Verify all 80 registered analysis entry points resolve and match the diagnostic catalog
        run: python -c "import json; from pathlib import Path; from tokamak_analysis.analysis_registry import ANALYSES, resolve_analysis; diagnostics=json.loads(Path('DIAGNOSTIC_REGISTRY.json').read_text(encoding='utf-8')); assert len(ANALYSES) == 80; assert [x['id'] for x in ANALYSES] == list(range(1, 81)); assert [x['name'] for x in ANALYSES] == [x['diagnostic'] for x in diagnostics]; [resolve_analysis(x['id']) for x in ANALYSES]; print('All 80 analysis titles, IDs, ordering, and callable entry points verified')"
      - name: Run numerical, API, and data-model tests
        run: python -m pytest -q --ignore=tests/test_app_smoke.py
      - name: Run Langmuir interactive dashboard regression tests
        run: python -m pytest -q tests/test_langmuir_dashboard.py
      - name: Run Doppler ion-temperature interactive dashboard acceptance tests
        run: python -m pytest -q tests/test_doppler_ion_temperature_dashboard.py
      - name: Run Rogowski interactive dashboard acceptance tests
        run: python -m pytest -q tests/test_rogowski_dashboard.py
      - name: Run Streamlit UI smoke tests
        run: python -m pytest -q tests/test_app_smoke.py
      - name: Check Python syntax
        run: python -m compileall -q tis tokamak_analysis app.py
