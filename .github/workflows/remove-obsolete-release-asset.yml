name: Remove obsolete v0.5.0 release asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-obsolete-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the obsolete v0.5.0 ZIP from v0.5.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.1 --json assets --jq '.assets[].name' | grep -Fxq 'Tokamak-Insight-Suite-v0.5.0.zip'; then
            gh release delete-asset v0.5.1 Tokamak-Insight-Suite-v0.5.0.zip --yes
          fi
