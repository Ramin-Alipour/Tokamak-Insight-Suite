name: Python tests

on:
  # Full cross-version matrix is opt-in; the canonical push gate is test-suite.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to main supersedes queued test runs for older commits.
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run cross-version core and scientific contract tests
        run: python -m pytest -q tests/test_core.py tests/test_core_scalar_contract.py tests/test_analysis_registry.py tests/test_formula_contracts.py tests/test_thomson_input_contract.py tests/test_ece_kinetic_input_contract.py
