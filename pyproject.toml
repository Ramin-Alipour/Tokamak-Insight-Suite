[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokamak-insight-suite"
version = "0.5.1"
description = "Provenance-aware analysis tools and diagnostic reference registry for tokamak plasma measurements"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["streamlit>=1.36", "numpy>=1.26", "pandas>=2.1, <3.1", "scipy>=1.11", "matplotlib>=3.8", "openpyxl>=3.1", "xlrd>=2.0.1", "pyarrow>=15", "pint>=0.24"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "playwright>=1.48"]
data = ["xarray>=2024.1,<2025.0", "zarr>=2.16,<3", "fsspec>=2024.2", "aiohttp>=3.9", "numcodecs>=0.12", "datasets>=3.0"]

[project.scripts]
tis = "tis.cli:main"

[tool.setuptools.packages.find]
include = ["tis*", "tokamak_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
tis = ["data/*.json"]
